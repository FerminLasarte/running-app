# Los tests del dominio (lib/domain/__tests__) en cada PR y en cada cambio a main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # la de Vercel
          cache: npm
      - run: npm ci
      - run: npm test
